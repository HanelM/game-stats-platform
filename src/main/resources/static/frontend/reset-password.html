<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/account.css">
</head>

<body>

<div class="top-navbar">

    <div class="nav-left">
        <h1>🎮Game <span>Stats </span>Platform</h1>
    </div>

    <div class="nav-links">

        <a href="index.html" >Home</a>

        <a href="games.html">Games</a>

        <a href="about.html">About</a>

        <a href="account.html" class="active-top" id="nav-user">
            Account
        </a>
        <div class="top-right-actions">

            <div id="adminButtonContainer"></div>

        </div>

    </div>

</div>


<section class="single-account-page">

    <div class="single-account-card">

        <h2>
            Reset Password
        </h2>

        <p>
            Enter the 6-digit verification code we sent
            to the email address associated with your account.
        </p>

        <p style="font-size:14px; color:#aaa;">
            If you don't see the email, please check your
            Spam/Junk folder.
        </p>


        <!-- VERIFICATION CODE -->

        <p id="verify-code-message"
           class="error-message">
        </p>

        <input
                type="text"
                id="verification-code"
                placeholder="Enter 6-digit code"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
        >

        <button
                type="button"
                onclick="verifyResetCode()">

            Verify Code

        </button>


        <!-- NEW PASSWORD -->

        <div id="new-password-section"
             style="display:none;">

            <input
                    type="password"
                    id="new-password"
                    placeholder="New password"
                    autocomplete="new-password"
            >

            <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
            >

            <p id="reset-password-message"
               class="error-message">
            </p>

            <button
                    type="button"
                    onclick="resetPassword()">

                Reset Password

            </button>

        </div>


        <p class="switch-text">

            Remember your password?

            <a href="login.html">
                Back to Login
            </a>

        </p>

    </div>

</section>


<script src="js/password-reset.js"></script>

</body>

</html>
