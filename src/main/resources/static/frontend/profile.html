<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Profile</title>

    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-top">

            <div id="profile-avatar"
                 class="profile-avatar">
            </div>

            <div>

                <h1 id="profile-username">
                    Username
                </h1>

                <p id="profile-email">
                    user@email.com
                </p>

            </div>

        </div>

        <div class="profile-stats">

            <div class="stat-box">

                <h2 id="totalMatches">
                    0
                </h2>

                <p>Total Matches</p>

            </div>

            <div class="stat-box">

                <h2 id="totalWins">
                    0
                </h2>

                <p>Total Wins</p>

            </div>

            <div class="stat-box">

                <h2 id="winRate">
                    0%
                </h2>

                <p>Win Rate</p>

            </div>

        </div>

    </div>

</div>

<script src="js/profile.js"></script>

</body>

</html>
